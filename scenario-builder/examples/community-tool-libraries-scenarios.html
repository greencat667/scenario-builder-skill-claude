<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Matrix</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #5b6474; --line: #d9dde5;
    --q1: #2f8f83; --q2: #55519c; --q3: #c2562b; --q4: #7a6a1f;
    --q1-soft: #e3f2ef; --q2-soft: #e8e7f5; --q3-soft: #f8e6dd; --q4-soft: #f2eedb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --panel: #1b2029; --ink: #e8ebf1; --muted: #a2aab8; --line: #313846;
      --q1: #5cc2b4; --q2: #9d99e0; --q3: #ec8a5e; --q4: #d2bd5a;
      --q1-soft: #183632; --q2-soft: #25243d; --q3-soft: #3b2419; --q4-soft: #332e17;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --panel: #1b2029; --ink: #e8ebf1; --muted: #a2aab8; --line: #313846;
    --q1: #5cc2b4; --q2: #9d99e0; --q3: #ec8a5e; --q4: #d2bd5a;
    --q1-soft: #183632; --q2-soft: #25243d; --q3-soft: #3b2419; --q4-soft: #332e17;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; }
  .question { color: var(--muted); margin: 0 0 4px; font-size: 1.05rem; }
  .note { color: var(--muted); font-size: .85rem; margin: 0 0 28px; }
  .matrix-wrap { display: grid; grid-template-columns: 28px 1fr; grid-template-rows: auto 1fr auto; gap: 8px; }
  .y-label { grid-row: 2; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center;
    font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .x-poles, .x-label { grid-column: 2; display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
  .x-label { justify-content: center; font-weight: 600; }
  .matrix { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; }
  .y-poles { position: absolute; left: -2px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
  .quad { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--panel);
    cursor: pointer; text-align: left; color: inherit; font: inherit; min-height: 150px;
    border-top: 5px solid var(--c); transition: transform .12s ease, box-shadow .12s ease; }
  .quad:hover, .quad:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); outline: none; }
  .quad[aria-pressed="true"] { background: var(--soft); }
  .quad .poles { font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
  .quad h2 { font-size: 1.15rem; margin: 0 0 6px; color: var(--c); }
  .quad p { margin: 0; font-size: .92rem; }
  .detail { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; border-left: 5px solid var(--c, var(--line)); }
  .detail h3 { margin: 0 0 4px; font-size: 1.25rem; color: var(--c); }
  .detail h4 { margin: 18px 0 6px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .detail ul { margin: 0; padding-left: 20px; }
  .detail li { margin: 3px 0; }
  .vignette { font-style: italic; border-left: 3px solid var(--line); padding-left: 12px; margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h3 { margin: 0 0 8px; font-size: 1rem; }
  .card ul { margin: 0; padding-left: 20px; }
  .card li { margin: 4px 0; font-size: .93rem; }
  footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
  @media (max-width: 700px) {
    .matrix { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    .matrix-wrap { grid-template-columns: 1fr; }
    .y-label, .x-poles, .x-label { display: none; }
    .quad .poles { display: block; }
  }
  @media (min-width: 701px) { .quad .poles { display: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="question" id="question"></p>
  <p class="note">Four plausible futures, not predictions. Select a world for details.</p>

  <div class="matrix-wrap">
    <div class="x-poles" style="grid-row:1"><span id="x-left"></span><span id="x-right"></span></div>
    <div class="y-label" id="y-label"></div>
    <div class="matrix" id="matrix"></div>
    <div class="x-label" id="x-label" style="grid-row:3"></div>
  </div>

  <section class="detail" id="detail" aria-live="polite"></section>

  <div class="grid2">
    <div class="card"><h3>True in every world</h3><ul id="predetermined"></ul></div>
    <div class="card"><h3>No-regret moves</h3><ul id="noregret"></ul></div>
  </div>

  <footer id="footer"></footer>
</main>

<script>
/* ===== Replace only this object ===================================== */
const SCENARIOS = {
  title: "Community Tool Libraries: Four Futures to 2036",
  question: "Should Riverside Environmental Trust make a network of community tool libraries its main local programme for 2026–2036?",
  footer: "Fictional organisation; real, cited drivers. Built with the scenario-builder skill.",
  axes: {
    x: { name: "Who runs it", left: "Community-run", right: "Platform-run" },
    y: { name: "Who pays", top: "Public purse", bottom: "User's pocket" }
  },
  worlds: [
    { quadrant: "tl", name: "The Civic Shed",
      headline: "Councils fund lending as local infrastructure, delivered through community trusts.",
      truths: ["Most towns have a lending and repair hub, often in a library or former shop", "Hubs run on five-year council service agreements with usage and waste targets", "Paid coordinators are normal; volunteers help with repair and events", "Free or means-tested membership, so low-income households use it most", "Small volunteer schemes merged into larger trusts or closed"],
      vignette: "Jo reads the contract renewal email twice on the bus. Five more years, same budget, plus a new target: 15% of members from the council's housing waiting list. At the hub, a councillor asks whether they could \"badge it more clearly as a council service\". Jo says the members like that it's theirs.",
      winners: "Established local charities with delivery capacity; residents without cars or storage; councils reporting waste savings",
      losers: "Small volunteer schemes; commercial hire in towns with good hubs; areas whose council said no",
      forUs: ["Chance to be a delivery partner with multi-year income", "Risk of becoming a contractor with a constrained advocacy voice", "Reorganisation (2027–28) is the moment of maximum influence"],
      indicators: ["3+ new unitary councils name lending or repair in their first corporate plan (by 2029)", "A council commissions a community trust for a council-wide lending service", "ACV first-refusal rights used to secure a hub building"] },
    { quadrant: "tr", name: "Borrow-as-a-Service",
      headline: "Councils buy a slick lending service from a national operator, like bike hire.",
      truths: ["Lockers everywhere, open 24/7, bookable in seconds", "A few national operators run most council contracts", "Kit is standardised and swapped out, not repaired", "Usage data belongs to the operator", "Rural areas and low-density estates get fewer lockers"],
      vignette: "The locker by the tram stop releases a carpet cleaner, still warm from the last user. Danielle doesn't know who owns it: the app has a council logo on the splash screen and a different company in the small print. The nozzle is cracked; she gets a £2 credit. The service doesn't fix anything. It swaps the broken ones out on Thursdays.",
      winners: "Platform operators; busy, digitally confident residents; councils valuing simple procurement",
      losers: "Local charities that ran hubs; repair volunteers; people without smartphones or cards; rural villages",
      forUs: ["Borrowing wins at scale, but our delivery role shrinks", "Real gap reaching people the platform under-serves", "Repair and durability become our distinctive contribution"],
      indicators: ["A council awards a council-wide lending contract to a commercial operator (by 2028)", "A national platform reports contracts with 20+ councils (by 2030)"] },
    { quadrant: "bl", name: "Members' Mutual",
      headline: "No public money; member-owned co-ops thrive where people can pay, and vanish elsewhere.",
      truths: ["Independent co-ops charging membership plus small loan fees", "The strongest have a paid coordinator and waiting lists", "No council targets and no council protection", "Members skew to homeowners, graduates and the already sharing-minded", "Deprived areas and small towns have few or no schemes"],
      vignette: "The AGM votes, narrowly, for a £72 membership with thirty \"pay what you can\" places. Afterwards Tom stacks chairs: the co-op is solvent, three new members from the new flats by the station. On the bus home he passes the estate whose scheme closed in 2029, and wonders how many people there would even know to ask.",
      winners: "Well-organised, better-off neighbourhoods; co-op and community-share infrastructure",
      losers: "Low-income households; renters who move often; car-free households outside dense areas",
      forUs: ["Our back-office and grant role becomes more valuable", "The equity gap becomes the central problem — and our natural focus", "We need our own income or a funder willing to subsidise access"],
      indicators: ["45+ councils receive exceptional financial support in one year (by 2029)", "Most new libraries of things launch as co-ops or community-share schemes (by 2030)"] },
    { quadrant: "br", name: "Rent Anything",
      headline: "Borrowing goes mainstream through commercial rental and delivery, with no charity involved.",
      truths: ["Renting occasional-use things is normal, via apps with delivery", "A few large platforms and retailers dominate; prices are low", "Very few community schemes remain; repair cafés survive as social spaces", "Rental fleets replace rather than repair", "People without cards, credit or a fixed address struggle to rent"],
      vignette: "Lewis rents a tile cutter at 10pm; it arrives at 8 in a van with three other rentals for the same street. His sister, between flats with no fixed address on file, can't open an account. On Saturday he passes the old library of things — a repair café now, twice a month. The sign says: \"We fix what they won't.\"",
      winners: "Platforms and retailers; convenience-seeking households with money and phones; manufacturers selling to rental fleets",
      losers: "Community schemes and their funders; unbanked people and those with poor credit",
      forUs: ["Our argument wins — without us", "Running hubs directly would be a poor use of money", "Leverage shifts to rules: durability, repair rights, rental standards, access"],
      indicators: ["A major DIY retailer launches consumer tool rental in 50+ stores (by 2030)", "The Ethical Consumer directory falls below 100 libraries of things (by 2030)"] }
  ],
  predetermined: ["Money, not green values, drives most borrowing", "A large, young private-renting population in small homes", "A quarter of households have no car — 44% of the poorest fifth", "134 councils merge into 38 unitaries by April 2028", "Formal volunteering won't bounce back on its own"],
  noRegret: ["Reach renters, car-free and low-income households", "Build shared back-office services: insurance, booking, safety, training", "Collect evidence on usage, reach, purchases avoided and waste diverted", "Keep repair skills alive", "Campaign for durability and repair rules"]
};
/* ==================================================================== */

const COLORS = { tl: "q1", tr: "q2", bl: "q3", br: "q4" };
const ORDER = ["tl", "tr", "bl", "br"];
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = (items) => (items || []).map((i) => `<li>${esc(i)}</li>`).join("");

document.title = SCENARIOS.title;
el("title").textContent = SCENARIOS.title;
el("question").textContent = SCENARIOS.question;
el("footer").textContent = SCENARIOS.footer || "";
const { x, y } = SCENARIOS.axes;
el("x-left").textContent = "← " + x.left;
el("x-right").textContent = x.right + " →";
el("x-label").textContent = x.name;
el("y-label").textContent = `${y.bottom}  ←  ${y.name}  →  ${y.top}`;
el("predetermined").innerHTML = list(SCENARIOS.predetermined);
el("noregret").innerHTML = list(SCENARIOS.noRegret);

const poleText = (q) => `${q[0] === "t" ? y.top : y.bottom} · ${q[1] === "l" ? x.left : x.right}`;
const byQuad = Object.fromEntries(SCENARIOS.worlds.map((w) => [w.quadrant, w]));

el("matrix").innerHTML = ORDER.map((q) => {
  const w = byQuad[q] || { name: "—", headline: "" };
  const c = COLORS[q];
  return `<button class="quad" data-q="${q}" aria-pressed="false"
      style="--c:var(--${c});--soft:var(--${c}-soft)">
      <div class="poles">${esc(poleText(q))}</div>
      <h2>${esc(w.name)}</h2><p>${esc(w.headline)}</p></button>`;
}).join("");

function show(q) {
  const w = byQuad[q]; if (!w) return;
  const c = COLORS[q];
  document.querySelectorAll(".quad").forEach((b) => b.setAttribute("aria-pressed", b.dataset.q === q));
  const d = el("detail");
  d.style.setProperty("--c", `var(--${c})`);
  d.innerHTML = `
    <h3>${esc(w.name)}</h3><div style="color:var(--muted)">${esc(poleText(q))}</div>
    ${w.vignette ? `<h4>A moment in this world</h4><p class="vignette">${esc(w.vignette)}</p>` : ""}
    ${w.truths?.length ? `<h4>What's true</h4><ul>${list(w.truths)}</ul>` : ""}
    ${w.winners || w.losers ? `<h4>Winners and losers</h4><ul><li><strong>Doing well:</strong> ${esc(w.winners)}</li><li><strong>Squeezed:</strong> ${esc(w.losers)}</li></ul>` : ""}
    ${w.forUs?.length ? `<h4>What it means for us</h4><ul>${list(w.forUs)}</ul>` : ""}
    ${w.indicators?.length ? `<h4>Early-warning indicators</h4><ul>${list(w.indicators)}</ul>` : ""}`;
}
el("matrix").addEventListener("click", (e) => {
  const b = e.target.closest(".quad"); if (!b) return;
  show(b.dataset.q);
  if (window.innerWidth <= 700) el("detail").scrollIntoView({ behavior: "smooth", block: "start" });
});
show("tl");
</script>
</body>
</html>
